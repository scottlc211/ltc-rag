server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 50

spring:
  application:
    name: ltc-rag
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:ltc_rag}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 3C4G 上不追并发：连接池 8 足够，留内存给 JVM 和 Qdrant
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:40}MB
      max-request-size: ${MAX_UPLOAD_MB:40}MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

rag:
  default-namespace: ${DEFAULT_NAMESPACE:ltc}

  auth:
    enabled: ${AUTH_ENABLED:true}

  chunking:
    # bge-large-zh 上限 512 token，中文约 1 字 ≈ 1 token，故按 480 字切
    max-child-chars: 480
    overlap-chars: 80
    max-parent-chars: 1600

  retrieval:
    vector-top-k: 30
    fulltext-top-k: 30
    context-top-n: 6
    rrf-k: 60
    min-score: 0.15

  embedding:
    # false = 轻量模式：不调 embedding，检索只走 BM25（无需外部 Key，也没有 Qdrant 依赖）
    enabled: ${EMBEDDING_ENABLED:true}
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
    dimension: ${EMBEDDING_DIMENSION:1024}
    batch-size: 10
    timeout-seconds: 60

  chat:
    base-url: ${CHAT_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${CHAT_API_KEY:}
    model: ${CHAT_MODEL:deepseek-chat}
    # 事实型问答温度要低，1.0 会一本正经地编
    temperature: 0.2
    max-tokens: 2048
    timeout-seconds: 180

  rerank:
    enabled: ${RERANK_ENABLED:true}
    base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${RERANK_API_KEY:}
    model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    timeout-seconds: 15

  # 图片 OCR：直接上传 png/jpg 时调用（默认复用本地 embedding 服务上的 /v1/ocr）
  ocr:
    enabled: ${OCR_ENABLED:true}
    base-url: ${OCR_BASE_URL:http://127.0.0.1:8091}

  storage:
    # false = 不连 Qdrant；与 embedding.enabled 一起关掉就是"纯 MySQL 单机模式"
    enabled: ${QDRANT_ENABLED:true}
    qdrant-url: ${QDRANT_URL:http://127.0.0.1:6333}
    collection: ${QDRANT_COLLECTION:ltc_chunks}

  callback:
    max-attempts: 5
    timeout-seconds: 10
    base-backoff-seconds: 10
    # 默认禁止回调内网/环回/云元数据地址（防 SSRF）；内网联调时可通过 CALLBACK_ALLOW_PRIVATE_IP=true 放开
    allow-private-ip: ${CALLBACK_ALLOW_PRIVATE_IP:false}

logging:
  level:
    root: INFO
    com.ltc.rag: INFO
